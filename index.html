<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build the Aqueduct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
*{box-sizing:border-box} body{margin:0}
/* Layout: projector stage. Arch + team on the left, feedback and leader choices on the right. One dark dusk look, sodium-lamp amber accent. */
:root{
  --sky:#18202c; --sky-2:#222c3b; --granite:#bfb3a0; --granite-dk:#857a69;
  --ink:#f2ede4; --muted:#a3a9b4; --amber:#e9a440; --bad:#d76a52; --good:#86b56f;
  --line:rgba(242,237,228,.16);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 30% 0%,var(--sky-2),var(--sky) 60%);background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:clamp(15px,1.25vw,22px);overflow-x:hidden}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-block:1.2rem;padding-inline:clamp(16px,3vw,48px);box-sizing:border-box;gap:1rem}
header{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;font-size:1.15em}
.brand span{color:var(--amber)}
.meta{display:flex;gap:1.2rem;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9em}
.meta b{color:var(--ink)}
.pips{display:flex;gap:.35rem}
.pip{width:.7em;height:.7em;border-radius:50%;border:1.5px solid var(--muted)}
.pip.on{background:var(--amber);border-color:var(--amber)}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(1rem,3vw,3rem);align-items:center}
@media (max-width:820px){main{grid-template-columns:1fr}}
.stage{min-width:0}
svg.arch{width:100%;height:auto;display:block;max-height:58vh}
.v{fill:transparent;stroke:var(--granite-dk);stroke-width:2;stroke-dasharray:6 6;transition:fill .3s}
.v.on{fill:var(--granite);stroke:#6c6253;stroke-dasharray:none;animation:drop .7s cubic-bezier(.3,1.4,.5,1)}
.v.lost{animation:fall .8s ease-in forwards}
.v.key.on{fill:var(--amber)}
.v.flash{stroke:var(--bad);stroke-width:3}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{0%{fill:var(--granite);transform:none}60%{fill:var(--bad);transform:translateY(60px) rotate(8deg);opacity:.2}100%{fill:transparent;transform:none;opacity:1}}
.pillar{fill:var(--granite)} .pillar-dk{fill:var(--granite-dk)}
.ground{stroke:var(--line);stroke-width:2}
.slot-label{fill:var(--muted);font:600 13px var(--f-body)}
.team{display:flex;flex-wrap:wrap;justify-content:center;gap:1.4rem;margin-top:.6rem;min-height:6.5em}
.mate{display:flex;flex-direction:column;align-items:center;gap:.3rem;transition:transform .6s,opacity .6s,filter .6s}
.mate .face{width:3.4em;height:3em;border-radius:46% 54% 42% 58%/55% 50% 50% 45%;background:var(--granite);position:relative;box-shadow:inset -6px -6px 0 rgba(0,0,0,.12)}
.mate .face::before,.mate .face::after{content:"";position:absolute;top:38%;width:.42em;height:.42em;border-radius:50%;background:#2a2a2a}
.mate .face::before{left:28%} .mate .face::after{right:28%}
.mate .mouth{position:absolute;left:50%;bottom:24%;width:1em;height:.45em;transform:translateX(-50%);border-bottom:3px solid #2a2a2a;border-radius:0 0 1em 1em}
.mate small{font-weight:700;font-size:.8em}
.mate.bright{transform:scale(1.25)} .mate.bright .face{background:#e2d4b8;box-shadow:0 0 0 4px rgba(233,164,64,.45),inset -6px -6px 0 rgba(0,0,0,.1)}
.mate.dim{transform:scale(.85);opacity:.55;filter:saturate(.3)}
.mate.dim .mouth{border-bottom:none;border-top:3px solid #2a2a2a;border-radius:1em 1em 0 0;bottom:18%}
.mate.small{transform:scale(.7);opacity:.6;filter:grayscale(1)}
.mate.small .mouth{width:.6em;border-radius:0}
.mate.silent .mouth{width:.6em;border-radius:0}
.mate.silent{opacity:.45;filter:grayscale(1)}
.mate.new{animation:popin .6s both}
@keyframes popin{from{transform:translateY(20px) scale(.6);opacity:0}}
.panel{min-width:0;display:flex;flex-direction:column;gap:1rem}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72em;color:var(--amber);font-weight:700}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:clamp(2.2em,4.4vw,4em);font-weight:800}
h2{font-size:clamp(1.5em,2.6vw,2.4em);font-weight:700}
p{margin:0;line-height:1.45;max-width:38em}
.lead{font-size:1.1em;color:var(--ink)}
.dim-t{color:var(--muted)}
.bubble{background:var(--ink);color:#1d1d1d;border-radius:1.2em 1.2em 1.2em .2em;padding:1em 1.2em;font-size:1.15em;font-weight:700;line-height:1.35;position:relative}
.bubble .who{display:block;font-size:.65em;text-transform:uppercase;letter-spacing:.1em;color:#6b6152;margin-bottom:.3em}
.bubble.empty{background:transparent;border:2px dashed var(--muted);color:var(--muted);font-style:italic}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:.7em;padding:.75em .9em;display:grid;grid-template-columns:auto 1fr;gap:.2em .7em;align-items:start;background:rgba(255,255,255,.03);transition:border-color .2s,background .2s,transform .2s}
.choice:hover,.choice:focus-visible{border-color:var(--amber);background:rgba(233,164,64,.08)}
.choice:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.choice .k{grid-row:span 2;font-family:var(--f-display);font-weight:800;font-size:1.5em;color:var(--amber);line-height:1}
.choice .t{font-weight:700}
.choice .d{font-size:.85em;color:var(--muted);line-height:1.35}
.choice.picked{border-color:var(--amber);background:rgba(233,164,64,.14)}
.choice.faded{opacity:.3}
.verdict{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.chip{font-weight:700;border-radius:999px;padding:.3em .8em;font-size:.95em;font-variant-numeric:tabular-nums}
.chip.good{background:rgba(134,181,111,.2);color:var(--good)}
.chip.bad{background:rgba(215,106,82,.2);color:var(--bad)}
.chip.mid{background:rgba(242,237,228,.12);color:var(--ink)}
.btn{all:unset;cursor:pointer;align-self:flex-start;background:var(--amber);color:#1b1b1b;font-weight:700;padding:.6em 1.2em;border-radius:.6em}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.rules{display:grid;gap:.5rem;padding:0;margin:0;list-style:none}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:baseline}
.rules li b{color:var(--amber);font-family:var(--f-display)}
footer{display:flex;flex-wrap:wrap;gap:1.2rem;justify-content:space-between;color:var(--muted);font-size:.75em}
kbd{font:inherit;border:1px solid var(--line);border-radius:.3em;padding:0 .4em;color:var(--ink)}
.fade{animation:fadein .5s both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">Build the <span>Aqueduct</span></div>
    <div class="meta">
      <div class="pips" id="pips" aria-label="Round progress"></div>
      <div>Stones <b id="stoneCount">3</b> / 9</div>
      <div id="clockWrap">⏱ <b id="clock">0:00</b></div>
    </div>
  </header>
  <main>
    <section class="stage">
      <svg class="arch" viewBox="0 0 600 430" role="img" aria-label="Aqueduct arch with stones">
        <line class="ground" x1="20" y1="420" x2="580" y2="420"/>
        <rect class="pillar-dk" x="70" y="20" width="460" height="22" rx="2"/>
        <rect class="pillar" x="60" y="40" width="480" height="10" rx="2"/>
        <rect class="pillar" x="95" y="235" width="80" height="185"/>
        <rect class="pillar" x="425" y="235" width="80" height="185"/>
        <rect class="pillar-dk" x="95" y="235" width="80" height="10"/>
        <rect class="pillar-dk" x="425" y="235" width="80" height="10"/>
        <g id="voussoirs"></g>
        <text class="slot-label" x="300" y="410" text-anchor="middle" id="archLabel">No mortar. Only stones holding each other.</text>
      </svg>
      <div class="team" id="team"></div>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <footer>
    <div><kbd>1</kbd>–<kbd>4</kbd> pick the room's vote · <kbd>Space</kbd> next · <kbd>R</kbd> restart · <kbd>T</kbd> timer · <kbd>F</kbd> fullscreen</div>
    <div>EMBA F2F · Segovia</div>
  </footer>
</div>

<script>
(() => {
  const START = 3, TARGET = 9;
  const FILL_ORDER = [0,8,1,7,2,6,3,5,4]; // keystone last

  const ROUNDS = [
    {
      who:"Marta", role:"Senior engineer",
      says:"I don't feel I can disagree with you in meetings. You've decided before we talk.",
      options:[
        {t:"Defend", d:"“I always ask for input. People should speak up more.”", delta:-1, mood:"small",
          out:"Marta hears: the problem is you. A stone falls."},
        {t:"Thank, do nothing", d:"“Thanks, really good point.” Nothing changes.", delta:0, mood:"dim",
          out:"It felt polite. Nothing moved. Marta notices."},
        {t:"Act quietly", d:"Ask for views before giving yours. Don't mention it.", delta:1, mood:"normal",
          out:"Meetings improve. Marta isn't sure it was because of her."},
        {t:"Act and close the loop", d:"Change how you run meetings, then tell the team: “Marta raised this. Here's what I changed.”", delta:2, mood:"bright", loop:true,
          out:"Marta sees her voice changed something. Two stones."}
      ]
    },
    {
      who:"Rui", role:"Design engineer",
      says:"Our daily stand-up runs 40 minutes. It eats my best focus time.",
      options:[
        {t:"Defend with data", d:"“Alignment prevents rework. The numbers say we need it.”", delta:-1, mood:"small",
          out:"Rui stops bringing problems. You won the argument and lost the signal."},
        {t:"Thank, do nothing", d:"“Fair. Let's look at it at some point.”", delta:0, mood:"dim",
          out:"“At some point” never comes. Rui stops asking."},
        {t:"Act quietly", d:"Cut it to 15 minutes. No explanation.", delta:1, mood:"normal",
          out:"Better meetings. The team guesses why."},
        {t:"Act and close the loop", d:"Cut to 15 minutes. “Rui flagged this. Tell me in two weeks if it works.”", delta:2, mood:"bright", loop:true,
          out:"Rui learns feedback is safe and useful. So does everyone watching."}
      ]
    },
    {
      who:"Priya", role:"Graduate engineer",
      says:"I made a mistake on the drawings last week. I was afraid to tell you.",
      options:[
        {t:"Find who's to blame", d:"“That should have been caught. Who checked it?”", delta:-1, mood:"small",
          out:"Next mistake, nobody tells you. You will find out from the customer."},
        {t:"Thank, do nothing", d:"“OK, thanks for telling me.”", delta:0, mood:"dim",
          out:"Priya is relieved. The process that let it slip stays the same."},
        {t:"Act quietly", d:"Fix the review step. Keep it between you.", delta:1, mood:"normal",
          out:"The gap closes. The fear stays."},
        {t:"Act and close the loop", d:"Thank her in front of the team for raising it early, fix the review step, report back.", delta:2, mood:"bright", loop:true,
          out:"Admitting a mistake just became the normal thing to do here."}
      ]
    }
  ];

  const $ = id => document.getElementById(id);
  let st;

  function reset(){
    st = {scene:"intro", round:0, stones:START, history:[], loops:0, team:[], picked:null, t0:null};
    st.team = [{name:"Marta",mood:"normal"}];
    buildArch();
    render();
  }

  // ---------- arch ----------
  function buildArch(){
    const g = $("voussoirs"); g.innerHTML = "";
    const cx=300, cy=235, r1=125, r2=193, n=9;
    for(let i=0;i<n;i++){
      const a0 = Math.PI - (i/n)*Math.PI, a1 = Math.PI - ((i+1)/n)*Math.PI;
      const gap = 0.012;
      const p = (r,a)=>[cx + r*Math.cos(a), cy - r*Math.sin(a)];
      const [x1,y1]=p(r1,a0-gap),[x2,y2]=p(r2,a0-gap),[x3,y3]=p(r2,a1+gap),[x4,y4]=p(r1,a1+gap);
      const path=document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d",`M${x1},${y1} L${x2},${y2} A${r2},${r2} 0 0 1 ${x3},${y3} L${x4},${y4} A${r1},${r1} 0 0 0 ${x1},${y1}Z`);
      path.setAttribute("class","v"+(i===4?" key":""));
      path.style.transformBox="fill-box"; path.style.transformOrigin="center";
      path.id="v"+i;
      g.appendChild(path);
    }
    paintArch(0, true);
  }
  function paintArch(prev, silent){
    const now = st.stones;
    FILL_ORDER.forEach((idx,k)=>{
      const el=$("v"+idx);
      const shouldOn = k < now, wasOn = k < prev;
      el.classList.remove("lost","flash");
      if(silent){ el.classList.toggle("on",shouldOn); el.style.animationDelay="0s"; return; }
      if(shouldOn && !wasOn){
        el.classList.remove("on"); void el.getBBox();
        el.style.animationDelay=((k-prev)*0.25)+"s";
        el.classList.add("on");
      } else if(!shouldOn && wasOn){
        el.classList.remove("on"); el.style.animationDelay="0s";
        void el.getBBox(); el.classList.add("lost");
      } else el.classList.toggle("on",shouldOn);
    });
    $("stoneCount").textContent = now;
  }

  // ---------- team ----------
  function renderTeam(){
    $("team").innerHTML = st.team.map(m=>`
      <div class="mate ${m.mood} ${m.isNew?'new':''}">
        <div class="face"><div class="mouth"></div></div>
        <small>${m.name}</small>
      </div>`).join("");
    st.team.forEach(m=>m.isNew=false);
  }
  function setMood(name,mood){ const m=st.team.find(x=>x.name===name); if(m) m.mood=mood; }
  function addMate(name,mood="normal"){ if(!st.team.find(x=>x.name===name)) st.team.push({name,mood,isNew:true}); }

  // ---------- scenes ----------
  function render(){
    const P = $("panel");
    $("pips").innerHTML = ROUNDS.map((_,i)=>`<span class="pip ${i<st.history.length?'on':''}"></span>`).join("");
    renderTeam();
    $("archLabel").textContent = st.scene==="final"
      ? (st.stones>=TARGET?"The keystone holds. The arch stands.":"Gaps where voices used to be.")
      : "No mortar. Only stones holding each other.";

    if(st.scene==="intro"){
      P.innerHTML = `<div class="fade" style="display:grid;gap:1.1rem">
        <div class="eyebrow">A game about acting on feedback</div>
        <h1>Build the Aqueduct</h1>
        <p class="lead">Segovia's aqueduct has stood for almost 2,000 years without mortar. Every stone carries the next one.</p>
        <p class="dim-t">A team works the same way. Each piece of feedback you act on is a stone. Ignore it, and the arch weakens.</p>
        <ul class="rules">
          <li><b>3</b><span>rounds. Your team gives you feedback.</span></li>
          <li><b>4</b><span>ways to react. The room votes with 1–4 fingers.</span></li>
          <li><b>9</b><span>stones complete the arch.</span></li>
        </ul>
        <button class="btn" id="go">Start</button></div>`;
      $("go").onclick = next;
    }

    if(st.scene==="round"){
      const R = ROUNDS[st.round];
      P.innerHTML = `<div class="fade" style="display:grid;gap:1rem">
        <div class="eyebrow">Round ${st.round+1} of 3 · Room, vote now</div>
        <div class="bubble"><span class="who">${R.who} · ${R.role}</span>${R.says}</div>
        <div class="choices">${R.options.map((o,i)=>`
          <button class="choice" data-i="${i}"><span class="k">${i+1}</span><span class="t">${o.t}</span><span class="d">${o.d}</span></button>`).join("")}
        </div></div>`;
      P.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
    }

    if(st.scene==="result"){
      const R = ROUNDS[st.round], o = R.options[st.picked];
      const cls = o.delta>1?"good":o.delta<0?"bad":"mid";
      const lbl = o.delta>0?`+${o.delta} stone${o.delta>1?"s":""}`:o.delta<0?"−1 stone":"No stone";
      P.innerHTML = `<div class="fade" style="display:grid;gap:1rem">
        <div class="eyebrow">Round ${st.round+1} · The room chose ${st.picked+1}</div>
        <div class="choices">${R.options.map((x,i)=>`
          <div class="choice ${i===st.picked?'picked':'faded'}"><span class="k">${i+1}</span><span class="t">${x.t}</span><span class="d">${x.d}</span></div>`).join("")}
        </div>
        <div class="verdict"><span class="chip ${cls}">${lbl}</span></div>
        <h2>${o.out}</h2>
        <button class="btn" id="go">${st.round<2?"Two weeks later →":"See the arch →"}</button></div>`;
      $("go").onclick = next;
    }

    if(st.scene==="later"){
      // delayed consequence before the next round
      let html="";
      if(st.round===1){
        const first = st.history[0];
        const ignored = ROUNDS[0].options[first].delta<=0;
        html = ignored
          ? `<div class="eyebrow">Two weeks later · Team meeting</div>
             <div class="bubble empty"><span class="who" style="color:inherit">Marta</span>…</div>
             <h2>Marta used to speak up. Today she says nothing.</h2>
             <p class="dim-t">Silence is the real cost of not acting. It doesn't show up as a complaint. It shows up as nothing.</p>`
          : `<div class="eyebrow">Two weeks later · Team meeting</div>
             <div class="bubble"><span class="who">Marta</span>I'm not sure this plan works. Can I show you why?</div>
             <h2>Marta disagrees with you, in the meeting. That's the point.</h2>
             <p class="dim-t">Rui was watching. He has something to say too.</p>`;
      } else {
        html = st.loops>0
          ? `<div class="eyebrow">Two weeks later · Something changed</div>
             <h2>People saw feedback lead somewhere. More of them step forward.</h2>
             <p class="dim-t">Closing the loop doesn't just fix one thing. It tells everyone watching that speaking up is safe.</p>`
          : `<div class="eyebrow">Two weeks later · A quiet room</div>
             <h2>Fewer people bring you problems now.</h2>
             <p class="dim-t">That can look like a calm team. It is often a team that stopped telling you things.</p>`;
      }
      P.innerHTML = `<div class="fade" style="display:grid;gap:1rem">${html}<button class="btn" id="go">Next feedback →</button></div>`;
      $("go").onclick = next;
    }

    if(st.scene==="final"){
      const done = st.stones>=TARGET;
      P.innerHTML = `<div class="fade" style="display:grid;gap:1rem">
        <div class="eyebrow">${st.stones} of 9 stones</div>
        <h1>${done?"The arch stands.":"The arch can't close."}</h1>
        <p class="lead">${done
          ? "Every stone is a voice that was heard and saw something change. That is trust, built one stone at a time."
          : "The missing stones are not missing complaints. They are people who stopped speaking up."}</p>
        <p class="dim-t">Thanking someone is not acting. Acting quietly is not enough. Trust comes from acting and telling people what changed.</p>
        <button class="btn" id="go">One thing for Monday →</button></div>`;
      $("go").onclick = next;
    }

    if(st.scene==="cta"){
      P.innerHTML = `<div class="fade" style="display:grid;gap:1.1rem">
        <div class="eyebrow">Your turn</div>
        <h1>Place one stone this week.</h1>
        <ul class="rules">
          <li><b>1</b><span>Pick one piece of feedback your team gave you.</span></li>
          <li><b>2</b><span>Act on it. Even a small change counts.</span></li>
          <li><b>3</b><span>Go back to the person and tell them what you changed.</span></li>
        </ul>
        <p class="dim-t">Step 3 is the one we skip. It is the one that builds the arch.</p>
        <button class="btn" id="go">Play again</button></div>`;
      $("go").onclick = reset;
    }
  }

  function choose(i){
    if(st.scene!=="round") return;
    const R = ROUNDS[st.round], o = R.options[i];
    let delta = o.delta;
    // Round 3 bonus: if the leader closed the loop before, others join and stones arrive faster
    if(st.round===2 && o.loop && st.loops>0) delta += 1;
    st.picked = i; st.history.push(i);
    if(o.loop) st.loops++;
    const prev = st.stones;
    st.stones = Math.max(0, Math.min(TARGET, st.stones + delta));
    setMood(R.who, o.mood);
    if(st.round===2 && o.loop && st.loops>1){ st.team.forEach(m=>{ if(m.mood!=="silent") m.mood="bright"; }); }
    st.scene = "result";
    render();
    // show bonus in label if applied
    if(delta!==o.delta){
      const chip=document.querySelector(".chip"); if(chip) chip.textContent=`+${delta} stones · others joined in`;
    }
    paintArch(prev);
  }

  function next(){
    if(st.t0===null) st.t0 = Date.now();
    if(st.scene==="intro"){ st.scene="round"; st.round=0; }
    else if(st.scene==="result"){
      if(st.round<2){
        st.round++;
        // delayed consequences on the team
        if(st.round===1){
          const ignored = ROUNDS[0].options[st.history[0]].delta<=0;
          setMood("Marta", ignored ? "silent" : "bright");
          addMate("Rui");
        } else {
          addMate("Priya");
          if(st.loops>0){ addMate("Jonas"); addMate("Lea"); }
          const r2 = ROUNDS[1].options[st.history[1]].delta<=0;
          if(r2) setMood("Rui","silent");
        }
        st.scene="later";
      } else st.scene="final";
    }
    else if(st.scene==="later"){ st.scene="round"; }
    else if(st.scene==="final"){ st.scene="cta"; }
    else if(st.scene==="cta"){ reset(); return; }
    render();
  }

  // ---------- timer ----------
  setInterval(()=>{
    if(st.t0===null){ $("clock").textContent="0:00"; return; }
    const s=Math.floor((Date.now()-st.t0)/1000);
    $("clock").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
    $("clock").style.color = s>=330 ? "var(--bad)" : "";
  },500);

  document.addEventListener("keydown",e=>{
    if(e.target.closest && e.target.closest("input,textarea")) return;
    if(["1","2","3","4"].includes(e.key) && st.scene==="round"){ choose(+e.key-1); }
    else if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){
      if(st.scene!=="round"){ e.preventDefault(); next(); }
    }
    else if(e.key==="r"||e.key==="R"){ reset(); }
    else if(e.key==="t"||e.key==="T"){ const w=$("clockWrap"); w.hidden=!w.hidden; }
    else if(e.key==="f"||e.key==="F"){
      try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }catch(_){}
    }
  });

  reset();
})();
</script>

</body>
</html>
